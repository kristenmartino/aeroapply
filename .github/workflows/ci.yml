name: CI
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same pull request; pushing twice used to run
# both to completion. Keyed by SHA on push so a branch/main run is never
# cancelled — cancellation follows workflow start order, not commit order, so
# cancelling a push run risks the newest commit never being the one validated.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aeroapply
          POSTGRES_PASSWORD: aeroapply
          POSTGRES_DB: aeroapply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeroapply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://aeroapply:aeroapply@localhost:5432/aeroapply
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src
      - name: Migrate (Postgres + pgvector)
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -q
        env:
          RUN_DB_TESTS: "1"
  # NOTE: build-time cross-model peer review (author model != reviewer model) is a
  # required PR gate — see docs/PEER_REVIEW.md (#17 tracks CI enforcement, still open).
